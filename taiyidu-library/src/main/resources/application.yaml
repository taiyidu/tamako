spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tamako?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 200710
  redis:
    host: localhost
    port: 6379
    password: 123456


mybatis-plus:
  # Mapper XML 文件位置（如果你写 XML 才需要，纯 BaseMapper 可不配）
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描包，用于 XML 里写 resultType 时省略全限定名
  type-aliases-package: com.taiyidu.taiyidulibrary.entity
  configuration:
    # 下划线转驼峰，比如 user_name -> userName
    map-underscore-to-camel-case: true
    # 开发时打印 SQL，上线可关掉
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto

logging:
  level:
    root: info
    # 你项目自己的包可以单独控制，不需要就删掉
    com.taiyidu: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ./logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 15
      total-size-cap: 2GB

server:
  port: 8080
  servlet:
    context-path: /tamako/taiyidulibrary          # 统一接口前缀（可选）
  tomcat:
    uri-encoding: UTF-8         # 中文参数编码（可选）
